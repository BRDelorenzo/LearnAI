<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login • LearnAI</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #2563eb;       /* azul da marca */
      --primary-dark: #1e40af;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;
      --radius: 14px;
      --shadow: 0 20px 40px rgba(15,23,42,.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(
        1200px 600px at 50% -200px,
        #e0e7ff 0%,
        var(--bg) 60%
      );
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
      padding: 24px;
    }

    .login-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
      text-align: center;
      animation: fadeUp .4s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 120px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 6px;
    }

    p.subtitle {
      margin: 0 0 22px;
      font-size: .95rem;
      color: var(--muted);
    }

    .field {
      text-align: left;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: .95rem;
      outline: none;
      transition: border .15s ease, box-shadow .15s ease;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }

    button {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
      );
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform .1s ease, box-shadow .1s ease, opacity .1s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(37,99,235,.25);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    #msg {
      margin-top: 14px;
      font-size: .85rem;
      color: #dc2626;
      min-height: 1em;
    }

    .footer-note {
      margin-top: 18px;
      font-size: .75rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="login-card">
      <!-- LOGO -->
      <img src="Logo_Ingles.jpeg" alt="LearnAI" class="logo" />

      <h1>Entrar no LearnAI</h1>
      <p class="subtitle">
        Acesso exclusivo para alunos autorizados
      </p>

      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          placeholder="seuemail@email.com"
          autocomplete="email"
        />
      </div>

      <button id="loginBtn">Entrar</button>

      <div id="msg"></div>

      <div class="footer-note">
        © LearnAI • REMAR Academy
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL =
      location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:3000"
        : "https://learnai-5y95.onrender.com";

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const msg = document.getElementById("msg");

      msg.textContent = "";

      if (!email) {
        msg.textContent = "Digite seu e-mail.";
        return;
      }

      try {
        const res = await fetch(API_BASE_URL + "/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) {
          msg.textContent = data.error || "Erro ao autenticar.";
          return;
        }

        localStorage.setItem("token", data.token);
        window.location.href = "index.html";
      } catch (err) {
        msg.textContent = "Erro de conexão com o servidor.";
      }
    };
  </script>

</body>
</html>
